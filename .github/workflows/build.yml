name: Build and Release Packages

on:
  push:
    branches:
      - git-action
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            rust_target: x86_64-unknown-linux-musl
            alpine_arch: x86_64
          - arch: aarch64
            rust_target: aarch64-unknown-linux-musl
            alpine_arch: aarch64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            rs/.cargo_cache
            rs/target
          key: cargo-${{ matrix.rust_target }}-${{ hashFiles('rs/Cargo.lock') }}
          restore-keys: |
            cargo-${{ matrix.rust_target }}-

      - name: Compile Rust binary
        run: |
          ./rs/cargo.sh build --release --target ${{ matrix.rust_target }}

      - name: Prepare signing key
        env:
          PACKAGING_RSA_KEY: ${{ secrets.PACKAGING_RSA_KEY }}
        run: |
          mkdir -p .local/keys
          if [ -n "$PACKAGING_RSA_KEY" ]; then
            echo "Setting up repository RSA signing key..."
            printf '%s\n' "$PACKAGING_RSA_KEY" > .local/keys/packaging.rsa
            chmod 600 .local/keys/packaging.rsa
          else
            echo "No PACKAGING_RSA_KEY secret found; using ephemeral key generation."
          fi

      - name: Package Alpine APKs
        run: |
          KEY_ARG=""
          if [ -f .local/keys/packaging.rsa ]; then
            KEY_ARG="-k .local/keys/packaging.rsa"
          fi
          ./pkg/apk/docker_build.sh $KEY_ARG -a ${{ matrix.alpine_arch }} -o dist/${{ matrix.arch }} rs/target/${{ matrix.rust_target }}/release/mdns-sieve

      - name: Stage distribution artifacts
        run: |
          ARCH="${{ matrix.arch }}"
          ALPINE_ARCH="${{ matrix.alpine_arch }}"
          TARGET="${{ matrix.rust_target }}"

          # Standalone ELF binary
          cp "rs/target/${TARGET}/release/mdns-sieve" "dist/${ARCH}/mdns-sieve-${ARCH}"
          chmod 755 "dist/${ARCH}/mdns-sieve-${ARCH}"

          # Package repository archive for Alpine
          mkdir -p "staging/${ALPINE_ARCH}"
          cp dist/${ARCH}/*.apk "staging/${ALPINE_ARCH}/"
          cp dist/${ARCH}/APKINDEX.tar.gz "staging/${ALPINE_ARCH}/"
          cp dist/${ARCH}/*.rsa.pub "staging/"
          tar -czf "dist/${ARCH}/mdns-sieve-alpine-${ARCH}.tar.gz" -C staging .
          rm -rf staging

          # Tag individual APK filenames with architecture to prevent naming collisions
          for f in dist/${ARCH}/*.apk; do
            [ -f "$f" ] && mv "$f" "dist/${ARCH}/$(basename "$f" .apk).${ARCH}.apk"
          done

      - name: Fix file permissions
        run: |
          sudo chown -R $USER:$USER dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mdns-sieve-${{ matrix.arch }}
          path: dist/${{ matrix.arch }}/*
          if-no-files-found: error

  release:
    name: Create Draft Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-files
          # Flatten artifacts from matrix jobs into a single directory for release
          find release-artifacts -type f -exec cp -n {} release-files/ \;
          echo "Files to be attached to release:"
          ls -la release-files

      - name: Create Draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: false
          generate_release_notes: true
          files: release-files/*
