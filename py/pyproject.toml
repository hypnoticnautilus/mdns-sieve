[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mdns-sieve"
version = "0.1.0"
description = "A lightweight, dependency-free mDNS reflector with fine-grained filtering."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "hcnguyen" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
mdns-sieve = "mdns_sieve.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mdns_sieve"]
