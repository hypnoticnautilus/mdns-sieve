[tox]
envlist = py310, py311, py312, py313, lint, type
isolated_build = true
skip_missing_interpreters = true

[testenv]
description = run unit tests
deps =
    pytest>=7.0
    pytest-cov>=4.0
commands =
    pytest {posargs:tests}

[testenv:lint]
description = run linter and formatter checks
deps =
    ruff>=0.1.0
    pylint>=3.0.0
    pyyaml>=6.0
commands =
    ruff check src/mdns_sieve tests
    ruff format --check src/mdns_sieve tests
    pylint src/mdns_sieve tests

[testenv:type]
description = run static type checks
deps =
    mypy>=1.0
    pyyaml>=6.0
    types-PyYAML
commands =
    mypy --strict src/mdns_sieve
