[package]
name = "mdns-sieve"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
regex = "1.10"
rusqlite = { version = "0.31", features = ["bundled"] }
tokio = { version = "1.37", features = ["full"] }
socket2 = { version = "0.5", features = ["all"] }
libc = "0.2"
clap = { version = "4.5", features = ["derive"] }
serde_json = "1.0"
axum = "0.7"
