[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mdns-sieve-gui"
version = "0.1.0"
description = "A zero-dependency web-based dashboard and HTTP-to-TCP API bridge for mdns-sieve server."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "hcnguyen" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
mdns-sieve-gui = "mdns_sieve_gui.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mdns_sieve_gui"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.ruff]
line-length = 100

[tool.pylint.messages_control]
disable = [
    "too-many-arguments",
    "too-many-positional-arguments",
]
